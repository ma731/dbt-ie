version: 2

models:
  - name: stg_customer_addresses
    columns:
      - name: address_id
        tests:
          - unique
          - not_null

  - name: stg_inventory
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - product_id
            - warehouse
    columns:
      - name: product_id
        tests:
          - not_null
      - name: warehouse
        tests:
          - not_null

  - name: stg_marketing_campaigns
    columns:
      - name: campaign_id
        tests:
          - unique
          - not_null

  - name: stg_suppliers
    columns:
      - name: supplier_id
        tests:
          - unique
          - not_null

  - name: stg_website_sessions
    columns:
      - name: session_id
        tests:
          - unique
          - not_null
