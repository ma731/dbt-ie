version: 2

models:
  - name: int_customers_enriched
    description: One row per customer with segment_id, full_name, and email_domain.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: segment_id
        description: Numeric segment identifier from the segments seed; NULL if the customer's segment label is missing from the seed.
      - name: full_name
        data_tests: [not_null]
      - name: email_domain
        data_tests: [not_null]

  - name: int_order_items_summary
    description: One row per order, aggregating line items.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: order_item_count
        data_tests: [not_null]
      - name: net_item_revenue
        data_tests: [not_null]

  - name: int_orders_with_items
    description: One row per order, header fields plus item summary.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: has_order_items
        data_tests: [not_null]

  - name: int_order_shipping_status
    description: One row per order with shipping timing and performance bucket.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: shipping_performance_bucket
        data_tests:
          - not_null
          - accepted_values:
              values: [not_shipped, early, on_time, late, unknown]

  - name: int_payments_by_order
    description: One row per order, aggregating payment transactions.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: payment_status_summary
        data_tests:
          - not_null
          - accepted_values:
              values: [paid, unpaid, partially_paid, payment_issue, unknown]

  - name: int_orders_enriched
    description: Main order-level model combining items, shipping, and payments.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: is_paid
        data_tests: [not_null]
      - name: is_completed_order
        data_tests: [not_null]

  - name: int_customer_order_sequence
    description: One row per customer-order, with sequence and time-since-previous via window functions.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: customer_order_number
        data_tests: [not_null]
      - name: is_first_order
        data_tests: [not_null]

unit_tests:
  - name: payment_status_paid_when_only_completed
    description: Single completed payment yields payment_status_summary = paid.
    model: int_payments_by_order
    given:
      - input: ref('stg_payments')
        rows:
          - {payment_id: pay_1, order_id: 1, payment_method: card, amount: 100.0, status: completed}
    expect:
      rows:
        - {order_id: 1, payment_count: 1, successful_payment_count: 1, total_paid_amount: 100.0, primary_payment_method: card, has_successful_payment: true, payment_status_summary: paid}

  - name: payment_status_unpaid_when_no_completed
    description: All payments failed yields payment_status_summary = unpaid.
    model: int_payments_by_order
    given:
      - input: ref('stg_payments')
        rows:
          - {payment_id: pay_2, order_id: 2, payment_method: card, amount: 100.0, status: failed}
    expect:
      rows:
        - {order_id: 2, payment_count: 1, successful_payment_count: 0, total_paid_amount: 0.0, primary_payment_method: card, has_successful_payment: false, payment_status_summary: unpaid}

  - name: payment_status_partially_paid_when_mix
    description: Mix of completed and non-completed payments yields partially_paid.
    model: int_payments_by_order
    given:
      - input: ref('stg_payments')
        rows:
          - {payment_id: pay_3a, order_id: 3, payment_method: card, amount: 100.0, status: completed}
          - {payment_id: pay_3b, order_id: 3, payment_method: card, amount:  50.0, status: failed}
    expect:
      rows:
        - {order_id: 3, payment_count: 2, successful_payment_count: 1, total_paid_amount: 100.0, primary_payment_method: card, has_successful_payment: true, payment_status_summary: partially_paid}
