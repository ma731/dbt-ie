version: 2

models:
  - name: int_customers_enriched
    description: One row per customer with segment_id, full_name, and email_domain.
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: segment_id
        description: Numeric segment identifier from the segments seed; NULL if the customer's segment label is missing from the seed.
      - name: full_name
        tests: [not_null]
      - name: email_domain
        tests: [not_null]

  - name: int_order_items_summary
    description: One row per order, aggregating line items.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: order_item_count
        tests: [not_null]
      - name: net_item_revenue
        tests: [not_null]

  - name: int_orders_with_items
    description: One row per order, header fields plus item summary.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: has_order_items
        tests: [not_null]

  - name: int_order_shipping_status
    description: One row per order with shipping timing and performance bucket.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: shipping_performance_bucket
        tests:
          - not_null
          - accepted_values:
              values: [not_shipped, early, on_time, late, unknown]

  - name: int_payments_by_order
    description: One row per order, aggregating payment transactions.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: payment_status_summary
        tests:
          - not_null
          - accepted_values:
              values: [paid, unpaid, partially_paid, payment_issue, unknown]

  - name: int_orders_enriched
    description: Main order-level model combining items, shipping, and payments.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: is_paid
        tests: [not_null]
      - name: is_completed_order
        tests: [not_null]

  - name: int_customer_order_sequence
    description: One row per customer-order, with sequence and time-since-previous via window functions.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: customer_order_number
        tests: [not_null]
      - name: is_first_order
        tests: [not_null]
