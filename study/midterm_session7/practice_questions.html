<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midterm Practice — 50 Questions</title>
<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --text: #1a202c;
    --muted: #4a5568;
    --accent: #2c5282;
    --accent-dark: #1a365d;
    --border: #e2e8f0;
    --correct: #38a169;
    --wrong: #e53e3e;
    --neutral: #cbd5e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    background: linear-gradient(135deg, #1a365d 0%, #2c5282 100%);
    color: white;
    padding: 30px 20px 25px;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
  }
  header h1 { margin: 0 0 8px; font-size: 28px; }
  header p { margin: 4px 0; opacity: 0.9; font-size: 14px; }
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px;
  }
  .controls {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    position: sticky;
    top: 8px;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .progress {
    font-size: 15px;
    color: var(--muted);
  }
  .progress strong {
    color: var(--accent-dark);
    font-size: 17px;
  }
  .score {
    font-size: 14px;
    color: var(--muted);
  }
  .score .correct-count {
    color: var(--correct);
    font-weight: 600;
  }
  .score .wrong-count {
    color: var(--wrong);
    font-weight: 600;
  }
  button.reset {
    background: var(--accent);
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
  }
  button.reset:hover { background: var(--accent-dark); }
  .section-header {
    margin: 32px 0 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--accent);
    color: var(--accent-dark);
    font-size: 18px;
    font-weight: 600;
  }
  .question {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 22px;
    margin-bottom: 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .question.answered.correct {
    border-color: var(--correct);
    background: #f0fff4;
  }
  .question.answered.wrong {
    border-color: var(--wrong);
    background: #fff5f5;
  }
  .question-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .question-num {
    font-weight: 600;
    color: var(--accent-dark);
    font-size: 15px;
  }
  .question-status {
    font-size: 13px;
    color: var(--muted);
  }
  .question-text {
    font-size: 15px;
    margin-bottom: 14px;
    color: var(--text);
  }
  .question-text code {
    background: #edf2f7;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 13px;
    font-family: "SF Mono", Monaco, Consolas, monospace;
  }
  .options { display: flex; flex-direction: column; gap: 6px; }
  .option {
    padding: 9px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    background: #fcfcfc;
    transition: all 0.15s;
    user-select: none;
  }
  .option:hover { background: #edf2f7; border-color: var(--neutral); }
  .option.selected.correct {
    background: #c6f6d5;
    border-color: var(--correct);
    color: #1a4a2a;
  }
  .option.selected.wrong {
    background: #fed7d7;
    border-color: var(--wrong);
    color: #742a2a;
  }
  .option.show-correct {
    background: #c6f6d5;
    border-color: var(--correct);
    color: #1a4a2a;
  }
  .option .label {
    display: inline-block;
    width: 22px;
    font-weight: 600;
    color: var(--accent);
  }
  .option.selected.correct .label,
  .option.show-correct .label { color: var(--correct); }
  .option.selected.wrong .label { color: var(--wrong); }
  .explanation {
    margin-top: 12px;
    padding: 10px 14px;
    background: #ebf4ff;
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    font-size: 13px;
    color: var(--muted);
    display: none;
  }
  .question.answered .explanation { display: block; }
  .explanation strong { color: var(--accent-dark); }
  footer {
    text-align: center;
    padding: 30px 20px;
    color: var(--muted);
    font-size: 13px;
  }
  @media (max-width: 600px) {
    header h1 { font-size: 22px; }
    .question { padding: 14px 16px; }
    .question-text { font-size: 14px; }
    .option { font-size: 13px; }
  }
</style>
</head>
<body>

<header>
  <h1>Midterm Practice — 50 Questions</h1>
  <p>dbt Sessions 1-7 · Click an option to answer · Score tracked live</p>
</header>

<div class="container">

  <div class="controls">
    <div class="progress">Answered: <strong id="answered">0</strong> / 50</div>
    <div class="score">
      <span class="correct-count" id="correct-count">✓ 0</span>
      &nbsp;·&nbsp;
      <span class="wrong-count" id="wrong-count">✗ 0</span>
      &nbsp;·&nbsp;
      Score: <strong id="percent">—</strong>
    </div>
    <button class="reset" onclick="resetQuiz()">Reset</button>
  </div>

  <div id="quiz"></div>

</div>

<footer>
  All questions and explanations from <code>study/midterm_session7/</code>. Exam: 2026-05-22.
</footer>

<script>
const questions = [
  {section: "Session 1 — Analytics Engineering & dbt Basics", questions: [
    {q: "In the modern data stack, dbt is responsible for which letter of ELT?",
     options: ["Extract", "Load", "Transform", "All three"], a: 2,
     why: "dbt is the 'T' in ELT — transforms data already in the warehouse."},
    {q: "Which of the following is <strong>not</strong> a stage of the Analytics Development Lifecycle (ADLC)?",
     options: ["Build", "Collaborate", "Deploy", "Visualize"], a: 3,
     why: "ADLC = Build / Collaborate / Deploy / Monitor. 'Visualize' is BI, not ADLC."},
    {q: "Which role typically sits between the Data Engineer and the Data Analyst, focused on modeling/testing/docs?",
     options: ["Data Scientist", "ML Engineer", "Analytics Engineer", "Backend Developer"], a: 2,
     why: "The Analytics Engineer bridges Engineering and Analysis."},
    {q: "What is the key technical reason ELT scales better than ETL?",
     options: ["ELT uses Python instead of SQL", "ELT leverages the warehouse's compute for transformation", "ELT requires less storage", "ELT is faster to write"], a: 1,
     why: "ELT pushes transformation INTO the warehouse, using its compute (often elastic)."},
    {q: "Which two roles does dbt simultaneously serve, internally?",
     options: ["Extractor and loader", "Compiler and runner", "Orchestrator and scheduler", "BI tool and database"], a: 1,
     why: "dbt is both a compiler (Jinja → SQL) and runner (executes against warehouse)."},
    {q: "Of the following, which is <strong>not</strong> part of dbt's 'control plane' purpose?",
     options: ["Testing", "Documentation", "Lineage", "Data ingestion"], a: 3,
     why: "dbt does NOT do ingestion. Control plane = testing/docs/lineage/orchestration."}
  ]},
  {section: "Session 2 — Setup, Project Structure, ref()", questions: [
    {q: "DuckDB is best described as:",
     options: ["A cloud data warehouse like Snowflake", "A streaming platform like Kafka", "A serverless, in-process OLAP database (SQLite for analytics)", "A Python library for visualizing data"], a: 2,
     why: "DuckDB = in-process, serverless OLAP, 'SQLite for analytics'."},
    {q: "Where does dbt look for <code>profiles.yml</code> <em>first</em>?",
     options: ["The user's home directory (~/.dbt/profiles.yml)", "The --profiles-dir CLI flag, if provided", "The project directory (next to dbt_project.yml)", "The DBT_PROFILES_DIR environment variable"], a: 1,
     why: "Resolution order: CLI flag → env var → project dir → ~/.dbt/. CLI flag wins."},
    {q: "Which file is the entrypoint that defines a dbt project's name, paths, and default materializations?",
     options: ["profiles.yml", "dbt_project.yml", "packages.yml", "manifest.json"], a: 1,
     why: "dbt_project.yml is the project's manifest."},
    {q: "Which folder should be in <code>.gitignore</code>?",
     options: ["models/", "seeds/", "target/", "macros/"], a: 2,
     why: "target/ is disposable build artifacts — always gitignored."},
    {q: "What does the <code>ref()</code> macro NOT do?",
     options: ["Resolve to the model's database/schema/table at compile time", "Build the project's DAG", "Connect to the data warehouse via the profile", "Help dbt determine model execution order"], a: 2,
     why: "ref() resolves names and builds DAG. It does NOT manage the warehouse connection — that's profiles.yml's job."},
    {q: "After <code>dbt run</code>, where would you find the <strong>rendered SQL</strong> (Jinja resolved) <strong>without</strong> the materialization DDL wrapping it?",
     options: ["target/run/", "target/compiled/", "logs/dbt.log", "target/manifest.json"], a: 1,
     why: "target/compiled/ = Jinja-rendered SQL, no DDL. target/run/ = with DDL wrapping."},
    {q: "Which command verifies that dbt can connect to your warehouse using <code>profiles.yml</code>?",
     options: ["dbt build", "dbt compile", "dbt debug", "dbt deps"], a: 2,
     why: "dbt debug exercises the connection and prints config."},
    {q: "Which naming convention is correct?",
     options: ["staging_customers", "customers_stg", "stg_customers", "stage.customers"], a: 2,
     why: "stg_* is the standard naming for staging models."}
  ]},
  {section: "Session 2b — Foundations: DuckDB / dbt fit", questions: [
    {q: "Which statement is true?",
     options: ["dbt extracts data from APIs and loads it into the warehouse", "dbt is a warehouse-agnostic SQL compiler and runner; you supply the warehouse", "dbt comes with built-in scheduling", "dbt replaces the warehouse and BI tools"], a: 1,
     why: "dbt is warehouse-agnostic. You bring the warehouse."},
    {q: "Which file is <strong>disposable</strong> — safe to delete and regenerate?",
     options: ["dbt_project.yml", "target/", "models/staging/stg_customers.sql", "packages.yml"], a: 1,
     why: "target/ is build artifacts. Delete + rerun = same result."},
    {q: "In <code>dbt run</code>'s flow, when does Jinja get rendered into pure SQL?",
     options: ["Before the DAG is built", "After the DAG is built, before execution against the warehouse", "During each model's execution, on the fly", "Never — dbt sends Jinja directly to the warehouse"], a: 1,
     why: "DAG is built first (from ref()/source() calls), then Jinja → SQL, then execute."},
    {q: "What's the right description of OLAP (data warehouse) workload characteristics?",
     options: ["Many small reads/writes, single-row queries", "Big scans and aggregations over millions of rows", "Real-time transaction logging", "Storing user session state for an app"], a: 1,
     why: "OLAP = analytical workloads = big scans + aggregations."}
  ]},
  {section: "Session 3 — Sources, Seeds, Tests, dbt build", questions: [
    {q: "How do you reference a raw <code>customers</code> table that's defined in <code>sources.yml</code> with source name <code>raw</code>?",
     options: ["from main.customers", "from {{ ref('customers') }}", "from {{ source('raw', 'customers') }}", "from {{ source('main.customers') }}"], a: 2,
     why: "source(source_name, table_name) — two-argument macro."},
    {q: "Which is <strong>NOT</strong> an appropriate transformation in a staging model?",
     options: ["Renaming columns to snake_case", "Casting order_date::date", "Joining customers to orders", "coalesce(country, 'unknown')"], a: 2,
     why: "Joins belong in intermediate, not staging. Staging is 1:1 with source."},
    {q: "Which <code>dbt</code> command loads CSVs from <code>seeds/</code> as warehouse tables?",
     options: ["dbt run", "dbt build", "dbt seed", "dbt source freshness"], a: 2,
     why: "dbt seed loads CSVs. Or dbt build which includes seeds."},
    {q: "Which is a valid way to reference a loaded seed <code>segments.csv</code> in a model?",
     options: ["from {{ source('seeds', 'segments') }}", "from {{ ref('segments') }}", "from seeds.segments", "from main.segments_csv"], a: 1,
     why: "Seeds are referenced exactly like models — via ref()."},
    {q: "A <code>unique</code> test passes when:",
     options: ["The column has at least one unique value", "Every value in the column is non-null", "No value in the column is repeated", "The column is a primary key"], a: 2,
     why: "unique fails if any duplicate is found — passes only when all values are distinct."},
    {q: "Which generic test enforces foreign-key integrity to another model?",
     options: ["accepted_values", "relationships", "not_null", "unique"], a: 1,
     why: "relationships enforces a FK to another model's column."},
    {q: "What does <code>dbt build</code> do that <code>dbt run</code> does NOT?",
     options: ["Generate documentation", "Compile Jinja", "Also run tests, seeds, and snapshots in DAG order", "Connect to the warehouse"], a: 2,
     why: "dbt build = run + test + seed + snapshot in DAG order."},
    {q: "If a <code>not_null</code> test fails on <code>stg_orders.order_id</code>, what happens to models downstream of <code>stg_orders</code> in the same <code>dbt build</code>?",
     options: ["They run normally — tests are advisory", "They are <strong>skipped</strong> to prevent bad data from propagating", "They run but mark their tests as failed too", "Only models with +grants are skipped"], a: 1,
     why: "Test failure on a model causes its descendants to be skipped — contains bad data."}
  ]},
  {section: "Session 4 — Layers, DAG, Selectors, SQL Patterns", questions: [
    {q: "Which layer should contain joins of multiple staging models?",
     options: ["Source", "Staging", "Intermediate", "Marts (always)"], a: 2,
     why: "Intermediate is where joins of staging models live. Marts join intermediates."},
    {q: "A DAG is <strong>acyclic</strong>, meaning:",
     options: ["Models cannot reference each other", "A model cannot depend on itself, directly or transitively", "Models are unsorted", "Tests cannot reference models"], a: 1,
     why: "Acyclic = no cycles. A → B → A would be a cycle (illegal)."},
    {q: "What does <code>dbt build -s +int_orders_enriched</code> build?",
     options: ["int_orders_enriched only", "int_orders_enriched and everything <strong>downstream</strong> of it", "int_orders_enriched and everything <strong>upstream</strong> of it", "The entire project, then int_orders_enriched again"], a: 2,
     why: "+model = include upstream. model+ = include downstream."},
    {q: "Which selector builds everything inside the <code>models/marts/</code> folder?",
     options: ["dbt build -s marts", "dbt build -s tag:marts", "dbt build -s mart_*", "dbt build -s @marts"], a: 0,
     why: "Plain folder name selects everything in that folder."},
    {q: "You change <code>stg_orders</code> and want to know what could break. Best selector?",
     options: ["dbt build -s stg_orders", "dbt build -s +stg_orders", "dbt build -s stg_orders+", "dbt build -s @stg_orders+"], a: 2,
     why: "stg_orders+ selects this model and all descendants — the impact radius."},
    {q: "A model called <code>int_customer_orders_ranked</code> uses <code>row_number() over (partition by customer_id order by order_date)</code>. Which SQL pattern is this?",
     options: ["Aggregation", "Window function", "Cleaning & casting", "Classification"], a: 1,
     why: "row_number() over (partition by ... order by ...) is the window-function pattern."},
    {q: "Two marts both need orders joined to customers. According to DRY, where should this join live?",
     options: ["Duplicated in each mart (faster execution)", "In an intermediate model both marts ref()", "In a database view created outside dbt", "Inline in each mart's CTE"], a: 1,
     why: "DRY says build once, ref many times. The intermediate is the canonical location."}
  ]},
  {section: "Session 5 — Practice: Foundation models", questions: [
    {q: "Joining <code>stg_orders</code> (1 row per order) directly to <code>stg_order_items</code> (N rows per order) without aggregation will:",
     options: ["Return one row per order", "Cause 'fan-out' — order header columns are duplicated N times", "Fail with a SQL syntax error", "Automatically deduplicate"], a: 1,
     why: "Fan-out: order columns duplicate N times when joined to an N-rows-per-order child."},
    {q: "Why build <code>int_order_items_summary</code> before joining to <code>stg_orders</code>?",
     options: ["Saves storage", "Reduces the item table to one row per order, preserving order grain", "Required by dbt's compiler", "Avoids the need for ref()"], a: 1,
     why: "Aggregating first creates a 1:1 grain, making the join to orders safe."},
    {q: "<code>mart_orders</code> is described as a 'wide table' because:",
     options: ["It has more rows than other marts", "It centralizes order facts so analysts don't have to join multiple tables in BI", "Its columns have wide data types (TEXT, BLOB)", "It includes data from multiple schemas"], a: 1,
     why: "'Wide' = many columns from many sources joined in, so BI doesn't have to."},
    {q: "A Python model in dbt is appropriate when:",
     options: ["The transformation is a simple select", "You need to read from a CSV", "Complex string parsing, ML, or API calls would be awkward in SQL", "Your warehouse does not support SQL"], a: 2,
     why: "Python models shine for text/ML/API work that's painful in SQL."}
  ]},
  {section: "Session 6 — Materializations & Grants", questions: [
    {q: "Which materialization creates a CTE that's inlined into downstream models, never persisted?",
     options: ["view", "table", "ephemeral", "incremental"], a: 2,
     why: "Ephemeral = no DDL — dbt inlines as a CTE in downstream models."},
    {q: "Default materializations by layer (per course best practice):",
     options: ["staging=table, intermediate=view, marts=table", "staging=view, intermediate=ephemeral or view, marts=table", "staging=ephemeral, intermediate=table, marts=view", "staging=incremental, intermediate=view, marts=table"], a: 1,
     why: "The course's stated best practice: views for staging, ephemeral/view for int, tables for marts."},
    {q: "If <code>dbt_project.yml</code> says <code>staging: +materialized: view</code>, but a specific staging model has <code>{{ config(materialized='table') }}</code> at the top, what materialization is used for that model?",
     options: ["view — project-level wins", "table — model-level overrides project-level", "ephemeral — they cancel each other out", "The model errors at compile time"], a: 1,
     why: "Model-level config() always overrides project-level defaults."},
    {q: "Which materialization is generally <strong>fastest to build</strong> but <strong>slowest to query</strong>?",
     options: ["table", "view", "incremental", "ephemeral"], a: 1,
     why: "Views are just stored queries — no data to write, but every query re-runs the SELECT."},
    {q: "Where does dbt apply <code>+grants</code>?",
     options: ["In profiles.yml", "In dbt_project.yml, under models:", "In packages.yml", "In the tests/ directory"], a: 1,
     why: "+grants is configured in dbt_project.yml under the models: key."}
  ]},
  {section: "Session 7 — Jinja, Macros & Packages", questions: [
    {q: "Which file declares external dbt packages to install with <code>dbt deps</code>?",
     options: ["dbt_project.yml", "requirements.txt", "packages.yml", "profiles.yml"], a: 2,
     why: "packages.yml lists dbt packages (vs. pyproject.toml/requirements.txt for Python)."},
    {q: "Which is <strong>NOT</strong> valid Jinja syntax inside a dbt model?",
     options: ["{{ my_var }}", "{% for col in cols %}{{ col }}{% endfor %}", "{# this is a comment #}", "<? echo my_var ?>"], a: 3,
     why: "<? ?> is PHP-style, not Jinja. Jinja uses {{ }} (expression) and {% %} (statement)."},
    {q: "Where should a custom macro file live?",
     options: ["models/", "macros/", "analyses/", "tests/"], a: 1,
     why: "Macros go in macros/. Models go in models/. Singular tests in tests/."},
    {q: "What does <code>dbt_utils.generate_surrogate_key(['order_id', 'product_id'])</code> return?",
     options: ["A SQL string that hashes the listed columns into a stable composite key", "A list of column names", "An auto-incrementing integer", "A foreign key constraint"], a: 0,
     why: "Hash-based composite key for 'primary key on multiple columns'."},
    {q: "In a Jinja <code>for</code> loop, which expression is true on the final iteration?",
     options: ["loop.first", "loop.last", "loop.end", "loop.finished"], a: 1,
     why: "loop.last is true on the final iteration — commonly used to skip trailing commas."},
    {q: "A model has <code>{% if target.name == 'dev' %} where order_date > '2024-01-01' {% endif %}</code>. What does this achieve?",
     options: ["Always filters data", "Filters data only in dev runs, not in prod", "Errors out unless target is explicitly set", "Forces dbt to skip this model in dev"], a: 1,
     why: "target.name differs per dbt target. The if filters dev only."},
    {q: "What's the right git workflow phrase for one logical change per commit?",
     options: ["Branchy commits", "Atomic commits", "Aggregated commits", "Lazy commits"], a: 1,
     why: "'Atomic commits' = one logical change per commit. Standard git hygiene."},
    {q: "Which of the following is a package commonly used in this course?",
     options: ["dbt_utils", "dbt_expectations", "codegen", "<strong>All of the above</strong>"], a: 3,
     why: "All three are listed in the course's packages.yml."}
  ]}
];

// Flatten with section labels
let flatQuestions = [];
let sections = [];
let qIndex = 0;
for (const section of questions) {
  sections.push({title: section.section, startIndex: qIndex});
  for (const q of section.questions) {
    flatQuestions.push(q);
    qIndex++;
  }
}

let state = JSON.parse(localStorage.getItem('quizState') || '{}');

function render() {
  const quiz = document.getElementById('quiz');
  quiz.innerHTML = '';
  let qNum = 1;
  let sectionIdx = 0;
  flatQuestions.forEach((q, i) => {
    if (sections[sectionIdx] && i === sections[sectionIdx].startIndex) {
      const h = document.createElement('div');
      h.className = 'section-header';
      h.textContent = sections[sectionIdx].title;
      quiz.appendChild(h);
      sectionIdx++;
    }
    const answered = state[i] !== undefined;
    const correct = answered && state[i] === q.a;
    const div = document.createElement('div');
    div.className = 'question' + (answered ? ' answered ' + (correct ? 'correct' : 'wrong') : '');
    div.id = 'q-' + i;
    div.innerHTML = `
      <div class="question-header">
        <span class="question-num">Q${qNum}.</span>
        <span class="question-status">${answered ? (correct ? '✓ Correct' : '✗ Incorrect') : 'Click an option'}</span>
      </div>
      <div class="question-text">${q.q}</div>
      <div class="options">
        ${q.options.map((opt, idx) => {
          let cls = 'option';
          if (answered) {
            if (idx === state[i]) cls += idx === q.a ? ' selected correct' : ' selected wrong';
            else if (idx === q.a) cls += ' show-correct';
          }
          return `<div class="${cls}" onclick="answer(${i}, ${idx})"><span class="label">${String.fromCharCode(65 + idx)})</span> ${opt}</div>`;
        }).join('')}
      </div>
      <div class="explanation"><strong>Why:</strong> ${q.why}</div>
    `;
    quiz.appendChild(div);
    qNum++;
  });
  updateProgress();
}

function answer(i, idx) {
  if (state[i] !== undefined) return; // already answered
  state[i] = idx;
  localStorage.setItem('quizState', JSON.stringify(state));
  render();
}

function updateProgress() {
  const answered = Object.keys(state).length;
  const correct = Object.entries(state).filter(([i, a]) => flatQuestions[i].a === a).length;
  const wrong = answered - correct;
  document.getElementById('answered').textContent = answered;
  document.getElementById('correct-count').textContent = '✓ ' + correct;
  document.getElementById('wrong-count').textContent = '✗ ' + wrong;
  document.getElementById('percent').textContent = answered === 0 ? '—' : Math.round(100 * correct / answered) + '%';
}

function resetQuiz() {
  if (!confirm('Reset all answers? This clears your progress.')) return;
  state = {};
  localStorage.removeItem('quizState');
  render();
}

render();
</script>

</body>
</html>
